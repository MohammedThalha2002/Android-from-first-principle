    <text x="622" y="82" text-anchor="middle" font-family="var(--font-ui)" font-size="12" fill="var(--dg-label)">physical memory</text>
    <rect x="576" y="96" width="92" height="26" rx="4" fill="var(--dg-fill-2)" stroke="var(--dg-line)" stroke-width="1"/>
    <text x="622" y="114" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--dg-muted)">page 2</text>
    <rect x="576" y="130" width="92" height="26" rx="4" fill="var(--dg-fill-2)" stroke="var(--dg-line)" stroke-width="1"/>
    <text x="622" y="148" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--dg-muted)">page 3</text>
    <rect x="576" y="164" width="92" height="26" rx="4" fill="var(--dg-fill-2)" stroke="var(--dg-line)" stroke-width="1"/>
    <text x="622" y="182" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--dg-muted)">page 7</text>
    <rect x="576" y="198" width="92" height="26" rx="4" fill="var(--dg-fill-2)" stroke="var(--dg-line)" stroke-width="1"/>
    <text x="622" y="216" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--dg-muted)">page 9</text>
  </g>

  <g data-part="hit-a">
    <rect x="576" y="164" width="92" height="26" rx="4" fill="var(--dg-accent)" stroke="var(--dg-accent)" stroke-width="1"/>
    <text x="622" y="182" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--dg-fill)">page 7</text>
    <path d="M514 68 C 546 100 552 150 570 174" fill="none" stroke="var(--dg-accent)" stroke-width="2" marker-end="url(#dg-arrow-a)"/>
  </g>

  <g data-part="hit-b">
    <path d="M514 272 C 546 220 552 140 570 112" fill="none" stroke="var(--dg-line)" stroke-width="2" marker-end="url(#dg-arrow-v)"/>
    <text x="520" y="200" font-family="var(--font-ui)" font-size="10" fill="var(--dg-muted)">page 2</text>
  </g>

  <g data-part="gap">
    <rect x="230" y="292" width="300" height="34" rx="6" fill="var(--dg-fill)" stroke="var(--dg-warn)" stroke-width="1.5"/>
    <text x="380" y="314" text-anchor="middle" font-family="var(--font-ui)" font-size="11" fill="var(--dg-warn)">no entry for the other app: no address exists</text>
  </g>
