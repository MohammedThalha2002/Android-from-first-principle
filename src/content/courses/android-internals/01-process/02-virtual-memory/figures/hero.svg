    <text x="285" y="184" text-anchor="middle" font-family="var(--font-ui)" font-size="10" fill="var(--dg-muted)">in the CPU</text>
    <path d="M196 62 C 220 90 224 116 240 132" fill="none" stroke="var(--dg-line)" stroke-width="1.5" marker-end="url(#dg-arrow-v)"/>
    <path d="M196 262 C 220 236 224 224 240 208" fill="none" stroke="var(--dg-line)" stroke-width="1.5" marker-end="url(#dg-arrow-v)"/>
  </g>

  <g data-part="table-a">
    <rect x="360" y="24" width="150" height="88" rx="6" fill="var(--dg-fill)" stroke="var(--dg-accent)" stroke-width="1.5"/>
    <text x="435" y="44" text-anchor="middle" font-family="var(--font-ui)" font-size="11" fill="var(--dg-muted)">page table, app A</text>
    <text x="435" y="66" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--dg-label)">0x7f2a01 to page 7</text>
    <text x="435" y="86" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--dg-muted)">0x7f2b00 to page 3</text>
    <text x="435" y="104" text-anchor="middle" font-family="var(--font-ui)" font-size="10" fill="var(--dg-muted)">written by the kernel</text>
    <path d="M338 152 C 352 100 350 70 354 62" fill="none" stroke="var(--dg-line)" stroke-width="1.5" marker-end="url(#dg-arrow-v)"/>
  </g>

  <g data-part="table-b">
    <rect x="360" y="228" width="150" height="88" rx="6" fill="var(--dg-fill)" stroke="var(--dg-line)" stroke-width="1.5"/>
    <text x="435" y="248" text-anchor="middle" font-family="var(--font-ui)" font-size="11" fill="var(--dg-muted)">page table, app B</text>
    <text x="435" y="270" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--dg-label)">0x7f2a01 to page 2</text>
    <text x="435" y="290" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--dg-muted)">0x7f4100 to page 9</text>
    <text x="435" y="308" text-anchor="middle" font-family="var(--font-ui)" font-size="10" fill="var(--dg-muted)">written by the kernel</text>
    <path d="M338 188 C 352 240 350 270 354 278" fill="none" stroke="var(--dg-line)" stroke-width="1.5" marker-end="url(#dg-arrow-v)"/>
  </g>

  <g data-part="ram">
