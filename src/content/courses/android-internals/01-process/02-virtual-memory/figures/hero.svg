<svg viewBox="0 0 700 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="dg-arrow-v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--dg-line)"/>
    </marker>
    <marker id="dg-arrow-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--dg-accent)"/>
    </marker>
  </defs>

  <g data-part="app-a">
    <rect x="16" y="20" width="176" height="62" rx="8" fill="var(--dg-fill)" stroke="var(--dg-accent)" stroke-width="1.5"/>
    <text x="104" y="44" text-anchor="middle" font-family="var(--font-ui)" font-size="12" fill="var(--dg-label)">your app asks for</text>
    <text x="104" y="66" text-anchor="middle" font-family="var(--font-mono)" font-size="13" fill="var(--dg-label)">0x7f2a01</text>
  </g>

  <g data-part="app-b">
    <rect x="16" y="240" width="176" height="62" rx="8" fill="var(--dg-fill)" stroke="var(--dg-line)" stroke-width="1.5"/>
    <text x="104" y="264" text-anchor="middle" font-family="var(--font-ui)" font-size="12" fill="var(--dg-label)">another app asks for</text>
    <text x="104" y="286" text-anchor="middle" font-family="var(--font-mono)" font-size="13" fill="var(--dg-label)">0x7f2a01</text>
  </g>

  <g data-part="mmu">
